<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #ffffff;
  font-family: 'Inter', sans-serif;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 30px 20px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 30px;
}

/* DESTACADO */
.featured {
  display: flex;
  gap: 30px;
  align-items: center;
}

.featured img {
  max-height: 300px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.featured .title {
  font-family: 'Playfair Display', serif;
  font-size: 30px;
  color: #f05546;
}

.featured .subtitle {
  font-size: 14px;
  color: #444;
  margin-top: 8px;
}

.button {
  display: inline-block;
  margin-top: 15px;
  padding: 8px 14px;
  border: 1px solid #f05546;
  color: #f05546;
  text-decoration: none;
  font-size: 13px;
}

.button:hover {
  background: #f05546;
  color: white;
}

/* LISTA DERECHA */
.list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.item {
  display: flex;
  gap: 15px;
  align-items: center;
}

.item img {
  height: 90px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.item .title {
  font-size: 16px;
  color: #f05546;
  font-family: 'Playfair Display', serif;
}

.item .subtitle {
  font-size: 12px;
  color: #666;
}

</style>
</head>

<body>

<div class="container">

  <div class="grid">

    <!-- DESTACADO -->
    <div class="featured">
      <img src="img/img1.webp">
      <div>
        <div class="title">José Carlos Mariátegui o el "cojito genial"</div>
        <div class="subtitle">Historia y discapacidad en el Perú</div>
        <a href="https://bibliografia.mariategui.org/cgi-bin/koha/opac-detail.pl?biblionumber=1093" class="button">Ver publicación</a>
      </div>
    </div>

    <!-- SECUNDARIOS -->
    <div class="list">

      <div class="item">
        <img src="img/img2.webp">
        <div>
          <div class="title">La utopía andina</div>
          <div class="subtitle">Europa y el país de los incas</div>
          <a href="https://bibliografia.mariategui.org/cgi-bin/koha/opac-detail.pl?biblionumber=1094" class="button">Ver publicación</a>
        </div>
      </div>

      <div class="item">
        <img src="img/img3.webp">
        <div>
          <div class="title">La escena contemporánea</div>
          <div class="subtitle">Edición facsimilar</div>
        </div>
      </div>

    </div>

  </div>

</div>

</body>
</html>
