<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #ffffff;
  font-family: 'Inter', sans-serif;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 30px 20px;
}

/* GRID */
.grid {
  position: relative;
}

/* SLIDES (cada estado de la vitrina) */
.vitrina-slide {
  position: absolute;
  width: 100%;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.vitrina-slide.active {
  opacity: 1;
  position: relative;
}

/* MEJOR ALINEACIÓN */
.featured {
  display: flex;
  gap: 40px;
  align-items: center; /* 👈 clave */
}

/* IMAGEN PRINCIPAL */
.featured img {
  max-height: 320px;
}

/* SECUNDARIOS MÁS GRANDES */
.item img {
  height: 120px; /* antes 90px */
}
/* DESTACADO */
.featured {
  display: flex;
  gap: 30px;
  align-items: center;
}

.featured img {
  max-height: 300px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.featured .title {
  font-family: 'Playfair Display', serif;
  font-size: 30px;
  color: #f05546;
}

.featured .subtitle {
  font-size: 14px;
  color: #444;
  margin-top: 8px;
}

.button {
  display: inline-block;
  margin-top: 15px;
  padding: 8px 14px;
  border: 1px solid #f05546;
  color: #f05546;
  text-decoration: none;
  font-size: 13px;
}

.button:hover {
  background: #f05546;
  color: white;
}

/* LISTA DERECHA */
.list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.item {
  display: flex;
  gap: 15px;
  align-items: center;
}

.item img {
  height: 90px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.item .title {
  font-size: 16px;
  color: #f05546;
  font-family: 'Playfair Display', serif;
}

.item .subtitle {
  font-size: 12px;
  color: #666;
}

</style>
</head>

<body>

<div class="vitrina-slide active">
  <div class="grid">

    <!-- DESTACADO -->
    <div class="featured">
      <img src="img/img1.webp">
      <div>
        <div class="title">Publicación 1</div>
        <div class="subtitle">Descripción</div>
      </div>
    </div>

    <!-- SECUNDARIOS -->
    <div class="list">
      <div class="item">
        <img src="img/img2.webp">
        <div>Publicación 2</div>
      </div>

      <div class="item">
        <img src="img/img3.webp">
        <div>Publicación 3</div>
      </div>
    </div>

  </div>
</div>

<div class="vitrina-slide">
  <div class="grid">
    <div class="featured">
      <img src="img/img2.webp">
      <div>
        <div class="title">Publicación 2</div>
        <div class="subtitle">Descripción</div>
      </div>
    </div>

    <div class="list">
      <div class="item">
        <img src="img/img3.webp">
        <div>Publicación 3</div>
      </div>

      <div class="item">
        <img src="img/img1.webp">
        <div>Publicación 1</div>
      </div>
    </div>
  </div>
</div>

<div class="vitrina-slide">
  <div class="grid">
    <div class="featured">
      <img src="img/img3.webp">
      <div>
        <div class="title">Publicación 3</div>
        <div class="subtitle">Descripción</div>
      </div>
    </div>

    <div class="list">
      <div class="item">
        <img src="img/img1.webp">
        <div>Publicación 1</div>
      </div>

      <div class="item">
        <img src="img/img2.webp">
        <div>Publicación 2</div>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

  let current = 0;
  const slides = document.querySelectorAll('.vitrina-slide');

  // Validación (evita errores si no encuentra nada)
  if (slides.length === 0) return;

  function showSlide(index) {
    slides.forEach((slide, i) => {
      slide.classList.toggle('active', i === index);
    });
  }

  // Estado inicial
  showSlide(current);

  // Autoplay
  setInterval(() => {
    current = (current + 1) % slides.length;
    showSlide(current);
  }, 6000); // más tiempo para leer

});
</script>

</body>
</html>
