<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #ffffff;
}

/* CONTENEDOR */
.slider {
  position: relative;
  max-width: 1000px;
  margin: auto;
  overflow: hidden;
}

/* TRACK */
.slides {
  display: flex;
  transition: transform 0.6s ease;
}

/* SLIDE */
.slide {
  min-width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 30px;
  box-sizing: border-box;
}

/* IMAGEN */
.slide img {
  max-height: 280px;
  width: auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* TEXTO */
.overlay {
  max-width: 400px;
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: #f05546;
}

.subtitle {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: #333;
}

.button {
  display: inline-block;
  margin-top: 15px;
  padding: 8px 14px;
  border: 1px solid #f05546;
  color: #f05546;
  text-decoration: none;
  font-size: 13px;
}

.button:hover {
  background: #f05546;
  color: white;
}

/* BOTONES */
.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: white;
  border: 1px solid #ddd;
  cursor: pointer;
  padding: 8px 12px;
  font-size: 18px;
}

.prev { left: 10px; }
.next { right: 10px; }

</style>
</head>

<body>

<div class="slider" id="slider">
  <div class="slides" id="slides">

    <!-- Slide 1 -->
    <div class="slide">
      <img src="img/img1.webp">
      <div class="overlay">
        <div class="title">José Carlos Mariátegui o el "cojito genial"</div>
        <div class="subtitle">Historia y discapacidad en el Perú</div>
        <a href="https://bibliografia.mariategui.org/cgi-bin/koha/opac-detail.pl?biblionumber=1093" class="button">Ver publicación</a>
      </div>
    </div>

    <!-- Slide 2 -->
    <div class="slide">
      <img src="img/img2.webp">
      <div class="overlay">
        <div class="title">La utopía andina</div>
        <div class="subtitle">Europa y el país de los incas</div>
        <a href="https://bibliografia.mariategui.org/cgi-bin/koha/opac-detail.pl?biblionumber=1094" class="button">Ver publicación</a>
      </div>
    </div>

    <!-- Slide 3 -->
    <div class="slide">
      <img src="img/img3.webp">
      <div class="overlay">
        <div class="title">La escena contemporánea</div>
        <div class="subtitle">Edición facsimilar</div>
      </div>
    </div>

  </div>
</div>
<!-- CONTROLES -->
  <button class="nav prev" onclick="moveSlide(-1)">‹</button>
  <button class="nav next" onclick="moveSlide(1)">›</button>

</div>

<script>
let index = 0;
const slides = document.getElementById('slides');
const total = slides.children.length;

function updateSlide() {
  slides.style.transform = `translateX(-${index * 100}%)`;
}

function moveSlide(step) {
  index = (index + step + total) % total;
  updateSlide();
}

/* AUTOPLAY */
let autoplay = setInterval(() => {
  moveSlide(1);
}, 5000);

/* PAUSA AL PASAR EL MOUSE */
document.getElementById('slider').addEventListener('mouseenter', () => {
  clearInterval(autoplay);
});

document.getElementById('slider').addEventListener('mouseleave', () => {
  autoplay = setInterval(() => moveSlide(1), 5000);
});
</script>

</body>
</html>
